[build]
  # 构建命令：进入 my-app 目录并构建 Web 版本
  command = "cd my-app && npm install && npx expo export --platform web"
  # 发布目录：指向构建后的 dist 目录
  publish = "my-app/dist"

# 重定向规则：处理 Expo Router 的路由
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 处理静态资源
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

