[build]
  # 构建命令：使用构建脚本或直接执行命令
  command = "cd my-app && npm install && npx expo export --platform web && (test -f public/_redirects && cp public/_redirects dist/_redirects || echo '/*    /index.html   200' > dist/_redirects)"
  # 发布目录：指向构建后的 dist 目录
  publish = "my-app/dist"

# 重定向规则：处理 Expo Router 的路由
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 处理静态资源
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

